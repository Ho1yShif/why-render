projects:
  - name: fde-render-explainer
    environments:
      - name: production
        services:
          - type: web
            runtime: static
            name: fde-render-explainer
            buildCommand: npm ci && npm run build
            staticPublishPath: dist
            headers:
              - path: /assets/*
                name: Cache-Control
                value: public, max-age=31536000, immutable
              - path: /*
                name: X-Frame-Options
                value: DENY
