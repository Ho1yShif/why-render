projects:
  - name: fde-render-explainer
    environments:
      - name: production
        services:
          - type: web
            name: why-render-web
            runtime: node
            plan: starter
            region: oregon
            buildCommand: npm ci && npm run build
            startCommand: npm start
            preDeployCommand: npm run migrate
            healthCheckPath: /health
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: why-render-db
                  property: connectionString
              - key: NODE_VERSION
                value: 24.14.1
        databases:
          - name: why-render-db
            databaseName: why_render
            user: why_render
            plan: basic-256mb
            region: oregon
